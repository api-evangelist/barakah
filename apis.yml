name: Barakah
description: Barakah is a Saudi foodtech company operating a consumer mobile marketplace that fights food
  waste by connecting restaurants, cafes, hotels, bakeries, and grocery retailers with consumers who buy
  their surplus, still-fresh meals and food products at discounts of up to 70 percent for pickup or delivery.
  Founded in Jeddah and backed by 500 Global, FoodLabs, and Salica Investments, Barakah has grown into one
  of the most downloaded food and drink apps in Saudi Arabia with partnerships across more than 800 merchants,
  including global brands. Barakah is a business-to-consumer mobile application and does not currently publish
  a public developer platform, API, or SDK; this profile captures its identity and public web surface.
